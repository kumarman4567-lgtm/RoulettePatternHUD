name: Build Roulette Pattern HUD APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RoulettePatternHUD_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q RoulettePatternHUD_Project.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoulettePatternHUD-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
